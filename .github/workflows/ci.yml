name: CI

# Everything here runs with no AWS account and no model. The store and the
# generator are substituted; the code between them is what runs in Lambda.

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: pytest tests/ -v

      - name: The demo runs end to end
        run: python demo.py

      # Every failure this guards against is silent: a Compare that never
      # matches, an attribute never set, a threshold that refuses nothing.
      # None of them raise, so a green pipeline would report success.
      - name: Break each control and prove a test catches it
        run: python verify_checks_fail.py

      - name: The tree is unchanged after fault injection
        run: git diff --exit-code
